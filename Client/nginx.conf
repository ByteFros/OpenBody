server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # La API va al backend por la red interna de Docker. Como el navegador la ve
    # en el mismo origen que el frontend, no hay peticiones cross-origin y CORS
    # deja de intervenir.
    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El healthcheck del backend, que el cliente consulta desde la portada.
    location = /health {
        proxy_pass http://server:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los assets llevan hash en el nombre, así que un cambio genera otro fichero
    # y se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: es quien apunta a los assets con hash, y si el
    # navegador se lo queda un deploy nuevo no se vería.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Cualquier otra ruta la resuelve React Router en el cliente, así que
    # servimos index.html en vez de un 404 (recargar en /organs/heart debe
    # funcionar).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
